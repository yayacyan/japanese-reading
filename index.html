<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="preload" href="assets/fonts/mplus-400.woff2?v=05ee5817de" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/mplus-800.woff2?v=2f7392d595" as="font" type="font/woff2" crossorigin />
    <style>
      /* 自架字型：只含本站用到的字，改文字後請跑 tools/build-fonts.py 重新產生 */
      @font-face{font-family:"M PLUS Rounded 1c";font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/mplus-400.woff2?v=05ee5817de) format("woff2")}
      @font-face{font-family:"M PLUS Rounded 1c";font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/mplus-700.woff2?v=a2d1e3f4dc) format("woff2")}
      @font-face{font-family:"M PLUS Rounded 1c";font-style:normal;font-weight:800;font-display:swap;src:url(assets/fonts/mplus-800.woff2?v=2f7392d595) format("woff2")}
      @font-face{font-family:"M PLUS Rounded 1c";font-style:normal;font-weight:900;font-display:swap;src:url(assets/fonts/mplus-900.woff2?v=a1082adc3f) format("woff2")}
      @font-face{font-family:"Noto Sans TC";font-style:normal;font-weight:100 900;font-display:swap;src:url(assets/fonts/notosanstc.woff2?v=9d8d6179ff) format("woff2")}
      :root{
        --bg:#FFFAFC; --surface:#FFFFFF; --surface2:#F6F2FF; --ink:#3B3A4A; --ink2:#6B6780; --line:#EFE6F2;
        --coral:#EE6A86; --blue:#4F8FE3; --orange:#EF8F3C; --plum:#9070DA; --teal:#2FA78C;
        --coral-t:#FFE9EF; --blue-t:#E7F1FF; --orange-t:#FFF0E3; --plum-t:#F2ECFF; --teal-t:#E1F6EF;
        --gram-bg:#F2ECFF; --shadow:0 8px 24px rgba(120,90,140,.10); --shadow-lg:0 14px 34px rgba(120,90,140,.16);
        --radius:24px; --top-h:66px;
        /* text and filled-button colors that pass WCAG AA contrast */
        --coral-ink:#C42E52; --teal-ink:#1D7562; --orange-ink:#A4520C; --blue-ink:#2463BD; --plum-ink:#6F4CC4; --on-accent:#FFFFFF;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#1D1B26; --surface:#282533; --surface2:#322E40; --ink:#F4F0FA; --ink2:#B7B0C8; --line:#3D3850;
          --coral:#FF9AB0; --blue:#8DBBFF; --orange:#FFB878; --plum:#C7AEFF; --teal:#7FDCC4;
          --coral-t:#4A2C36; --blue-t:#25344D; --orange-t:#4A3526; --plum-t:#372D52; --teal-t:#1F4239;
          --gram-bg:#372D52; --shadow:0 10px 30px rgba(0,0,0,.4); --shadow-lg:0 14px 34px rgba(0,0,0,.5);
          --coral-ink:#FF9AB0; --teal-ink:#7FDCC4; --orange-ink:#FFB878; --blue-ink:#8DBBFF; --plum-ink:#C7AEFF; --on-accent:#1D1B26;
        }
      }
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
      body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Noto Sans TC","Noto Sans JP",system-ui,sans-serif;line-height:1.7;
        background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--coral) 14%,transparent) 1.4px, transparent 0);background-size:26px 26px}
      body.sheet-open{overflow:hidden}
      .jp{font-family:"M PLUS Rounded 1c","Noto Sans JP","Noto Sans TC",sans-serif}
      .maru{font-family:"M PLUS Rounded 1c","Noto Sans TC",sans-serif}
      button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
      button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
      img{display:block;max-width:100%}
      .wrap{max-width:900px;margin:0 auto;padding:0 16px 96px}
      @keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}
      @keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
      @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
      main:not([hidden]){animation:pop .35s ease}

      /* top bar */
      .topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px dashed var(--line)}
      .topbar-in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
      .brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.05rem;margin-right:6px;white-space:nowrap;min-height:44px;padding:0 4px;border-radius:14px}
      .brand img{width:38px;height:38px;object-fit:contain;transition:transform .3s}
      .brand:hover img{animation:wiggle .5s ease}
      .tabs{display:flex;gap:8px;flex:1;min-width:0}
      .tab{min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:.95rem;display:inline-flex;align-items:center;gap:7px;transition:transform .15s,background .2s,border-color .2s;white-space:nowrap}
      .tab:hover{border-color:var(--coral);transform:translateY(-1px)}
      .tab:active{transform:scale(.96)}
      .tab[aria-current="page"]{background:var(--coral-ink);color:var(--on-accent);border-color:var(--coral-ink);box-shadow:0 6px 14px color-mix(in srgb,var(--coral) 35%,transparent)}
      .tab .badge{background:var(--on-accent);color:var(--coral-ink);border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;padding:0 6px;font-weight:900;box-shadow:inset 0 0 0 2px var(--coral)}
      .tab .badge.bump{animation:wiggle .45s ease}
      .langseg{flex:none;display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);padding:3px;gap:2px}
      .langseg button{white-space:nowrap;min-height:40px;min-width:44px;padding:6px 12px;font-weight:800;font-size:.85rem;border-radius:999px;transition:background .2s}
      .langseg button[aria-pressed="true"]{background:var(--teal-ink);color:var(--on-accent)}
      @media (max-width:560px){ .brand span{display:none} .brand{margin-right:0} .brand img{width:34px;height:34px} .tab{padding:8px 12px;font-size:.9rem} .langseg button{padding:6px 9px} }
      @media (max-width:430px){ .topbar-in{gap:6px;padding:10px 12px} .tabs{gap:6px} .tab{padding:8px 10px;font-size:.86rem;gap:5px} .tab .badge{min-width:20px;height:20px;font-size:.72rem;padding:0 5px} .brand img{width:30px;height:30px} .langseg button{padding:6px 8px;font-size:.8rem} }
      @media (max-width:360px){ .brand{display:none} }

      /* hero */
      .hero{padding:30px 0 6px}
      .hero-grid{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
      .mascot{width:170px;height:170px;object-fit:contain;animation:floaty 4s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(120,90,140,.15))}
      @media (max-width:640px){ .hero-grid{grid-template-columns:1fr;position:relative} .mascot{width:86px;height:86px;position:absolute;right:-4px;top:-14px} .hero h1{padding-right:84px} }
      .hero h1{font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.35;margin:0 0 10px;font-weight:900;letter-spacing:.01em}
      .hero h1 .hl{color:var(--coral-ink);background:linear-gradient(transparent 62%,color-mix(in srgb,var(--coral) 22%,transparent) 62%);border-radius:4px;padding:0 2px}
      .hero p{margin:0;color:var(--ink2);font-size:1.02rem;max-width:34em}
      .hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
      .cta{min-height:50px;padding:10px 20px;border-radius:18px;font-weight:900;font-size:1rem;display:inline-flex;align-items:center;transition:transform .15s,background .2s,border-color .2s}
      .cta.primary{background:var(--coral-ink);color:var(--on-accent);box-shadow:0 8px 18px color-mix(in srgb,var(--coral) 30%,transparent)}
      .cta.primary:hover{transform:translateY(-2px)}
      .cta.ghost{background:var(--surface);border:2px solid var(--line)}
      .cta.ghost:hover{border-color:var(--teal)}
      .cta:active{transform:scale(.97)}
      @media (max-width:560px){ .cta{width:100%;justify-content:center} }
      .skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;text-decoration:none}
      .skip:focus{top:10px}
      .listen{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:10px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:.92rem;transition:border-color .2s,background .2s}
      .listen:hover{border-color:var(--blue);background:var(--blue-t)}
      .listen svg{width:18px;height:18px}
      .why rt,.qq rt,.opt rt{font-weight:500}
      [tabindex="-1"]:focus{outline:none}
      .stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
      .stat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 16px;display:flex;align-items:baseline;gap:8px;box-shadow:var(--shadow)}
      .stat b{font-size:1.4rem;color:var(--coral-ink)}
      .stat:nth-child(2) b{color:var(--teal-ink)}
      .stat span{color:var(--ink2);font-size:.9rem;font-weight:700}

      /* steps */
      .sec-title{font-size:1.3rem;font-weight:900;margin:38px 0 6px;display:flex;align-items:center;gap:8px}
      .sec-title::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:16px 0 0 -2px var(--teal);margin-right:14px;flex:none}
      .sec-sub{color:var(--ink2);margin:0 0 14px;font-size:.95rem}
      .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
      .step{display:flex;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;transition:transform .2s,box-shadow .2s}
      .step:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:var(--shadow-lg)}
      .step .n{flex:none;width:34px;height:34px;border-radius:12px;color:var(--on-accent);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:1rem;transform:rotate(-6deg);box-shadow:0 4px 10px rgba(0,0,0,.08)}
      .step h3{margin:0 0 2px;font-size:1.02rem;font-weight:800}
      .step p{margin:0;color:var(--ink2);font-size:.88rem;line-height:1.6}

      /* levels */
      .levels{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
      .lv{min-height:48px;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:900;font-size:1.02rem;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,border-color .2s,background .2s}
      .lv:hover{transform:translateY(-2px);border-color:var(--teal)}
      .lv:active{transform:scale(.95)}
      .lv small{font-weight:700;font-size:.75rem;color:var(--ink2)}
      .lv[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-t);box-shadow:0 6px 14px color-mix(in srgb,var(--teal) 25%,transparent)}
      .lv .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
      .lv.soon .dot{background:var(--ink2);opacity:.45;box-shadow:none}
      .lv-arrow{color:var(--coral-ink);font-weight:900;font-size:.8rem;opacity:.7}
      .soon-panel{margin-top:14px;background:var(--surface);border:2.5px dashed var(--line);border-radius:var(--radius);padding:26px 20px;text-align:center;color:var(--ink2)}
      .soon-panel img{width:92px;height:92px;object-fit:contain;margin:0 auto 8px;animation:floaty 4s ease-in-out infinite}
      .soon-panel .big{font-size:1.15rem;font-weight:900;color:var(--ink);margin-bottom:4px}
      .soon-panel p{margin:0}

      /* article cards */
      .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:16px}
      .card{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
      .card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
      .card img{width:100%;height:auto;aspect-ratio:1077/758;object-fit:contain;transition:transform .4s;filter:drop-shadow(0 4px 10px rgba(120,90,140,.10))}
      .card:hover img{transform:scale(1.04)}
      .card .imgbox{overflow:hidden;padding:12px 12px 2px}
      .card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
      .card .kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
      .chip{font-size:.76rem;font-weight:800;padding:3px 11px;border-radius:999px}
      .chip.done{background:var(--teal-t);color:var(--teal-ink)}
      .card h3{margin:2px 0 0;font-size:1.3rem;line-height:1.4;font-weight:900}
      .card .zh{font-weight:800}
      .card p{margin:0;color:var(--ink2);font-size:.92rem}
      .card .meta{margin-top:auto;padding-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink2);font-size:.84rem;font-weight:700}
      .card .go{margin-top:10px;min-height:48px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:transform .15s,background .2s}
      .card .go:hover{background:var(--coral-ink);color:var(--on-accent)}
      .card .go:active{transform:scale(.97)}

      /* modules */
      .mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
      .mod{background:var(--surface);border:2px dashed var(--line);border-radius:20px;padding:16px 18px}
      .mod h3{margin:0 0 4px;font-size:1.05rem;display:flex;align-items:center;gap:9px;font-weight:800}
      .mod .ic{width:36px;height:36px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
      .mod p{margin:0;color:var(--ink2);font-size:.9rem}
      .soon-badge{margin-left:auto;font-size:.72rem;font-weight:800;background:var(--surface2);color:var(--ink2);padding:3px 9px;border-radius:999px;white-space:nowrap}

      /* reader */
      .backbtn{min-height:44px;display:inline-flex;align-items:center;gap:6px;font-weight:800;padding:8px 14px;margin:14px 0 4px;border-radius:999px;background:var(--surface);border:2px solid var(--line);transition:transform .15s,border-color .2s}
      .backbtn:hover{border-color:var(--coral);transform:translateX(-2px)}
      .reader-head h2{margin:6px 0 2px;font-size:1.7rem;line-height:1.4;font-weight:900}
      .reader-head .zh{font-weight:800;font-size:1.05rem}
      .reader-head p{color:var(--ink2);margin:4px 0 0}
      .reader-img{width:100%;height:auto;aspect-ratio:1077/758;object-fit:contain;margin-top:14px;filter:drop-shadow(0 10px 20px rgba(120,90,140,.14))}
      .toolbar{position:sticky;top:calc(var(--top-h) + 6px);z-index:30;margin-top:14px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;box-shadow:var(--shadow)}
      .furi{display:flex;align-items:center;gap:10px;font-weight:800;min-height:44px}
      .switch{position:relative;width:56px;height:32px;flex:none;padding:0;min-height:32px}
      .switch .track{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.25s}
      .switch .track::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.25s cubic-bezier(.5,1.6,.5,1)}
      .switch[aria-checked="true"] .track{background:var(--teal)}
      .switch[aria-checked="true"] .track::after{left:28px}
      .switch:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:999px}
      .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.86rem;color:var(--ink2);align-items:center}
      .legend .sw-v{border-bottom:2.5px dotted var(--blue);font-weight:700;color:var(--ink)}
      .legend .sw-g{background:var(--gram-bg);border-bottom:2.5px solid var(--plum);font-weight:700;color:var(--ink);padding:0 4px;border-radius:4px}
      .progress-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
      .reader-legend{margin-top:10px}
      .pstep{font-size:.84rem;font-weight:800;border:2px solid var(--line);color:var(--ink2);border-radius:999px;padding:5px 12px;background:var(--surface);transition:all .25s}
      .pstep.on{border-color:var(--teal);color:var(--teal-ink);background:var(--teal-t)}
      .passage{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:24px 22px 14px;margin-top:14px;box-shadow:var(--shadow);
        background-image:repeating-linear-gradient(transparent 0 calc(2.35em - 1px), color-mix(in srgb,var(--blue) 9%,transparent) calc(2.35em - 1px) 2.35em);background-size:100% 2.35em}
      .passage p{font-size:1.22rem;line-height:2.35;margin:0 0 18px;letter-spacing:.02em}
      body.no-furi #view-reader rt, body.no-furi .sheet .ex rt, body.no-furi .sheet .body rt{display:none}
      rt{font-size:.52em;color:var(--ink2);font-weight:500}
      .tok{border-radius:6px;padding:2px 1px;-webkit-tap-highlight-color:transparent}
      button.tok{min-height:0;transition:background .15s}
      button.tok-1{min-width:1.9em;text-align:center}
      .tok-v{border-bottom:2.5px dotted var(--blue);cursor:pointer}
      .tok-v:hover{background:var(--blue-t)}
      .tok-g{background:var(--gram-bg);border-bottom:2.5px solid var(--plum);font-weight:700;cursor:pointer}
      .tok-g:hover{background:color-mix(in srgb,var(--plum) 22%,transparent)}
      .tok-v.tok-g{border-bottom:2.5px solid var(--plum)}
      .tok:active{background:var(--blue-t)}
      .tok.seen.tok-v:not(.tok-g){background:color-mix(in srgb,var(--blue) 8%,transparent)}

      /* grammar list + quiz */
      .panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:22px 20px;margin-top:18px;box-shadow:var(--shadow)}
      .panel h3{margin:0 0 4px;font-size:1.22rem;font-weight:900}
      .panel .sub{color:var(--ink2);margin:0 0 14px;font-size:.92rem}
      .gitem{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:16px;border:2px solid var(--line);margin-bottom:10px;min-height:52px;background:var(--surface);transition:transform .15s,border-color .2s,background .2s}
      .gitem:hover{border-color:var(--plum);background:var(--plum-t);transform:translateX(3px)}
      .gitem .pat{font-weight:900;color:var(--plum-ink);white-space:nowrap}
      .gitem .tt{font-weight:700}
      .gitem .arr{margin-left:auto;color:var(--plum-ink);font-weight:900}
      .q{border-top:2px dashed var(--line);padding:16px 0 4px}
      .q:first-of-type{border-top:none}
      .q .qq{font-size:1.08rem;font-weight:800;margin:0 0 12px}
      .q .qnum{color:var(--on-accent);background:var(--coral-ink);font-weight:900;margin-right:10px;border-radius:10px;padding:1px 9px;font-size:.9rem;display:inline-block}
      .opts{display:grid;gap:9px}
      .opt{min-height:50px;text-align:left;border:2px solid var(--line);border-radius:16px;padding:11px 15px;font-size:1.05rem;background:var(--surface);display:flex;align-items:center;gap:10px;width:100%;transition:transform .15s,border-color .2s,background .2s}
      .opt:not(:disabled):hover{border-color:var(--blue);background:var(--blue-t);transform:translateY(-1px)}

    <script>
    /* ============ Grammar library (bilingual) ============ */
    var GRAMMAR = {
      he:{pattern:"〜へ 行きます",t_zh:"往某個地方去",t_en:"Going to a place",b_zh:"「へ」唸作「え」，放在地點後面，標示移動的方向。中文的「去某地」，日文會說「地點＋へ＋行きます」。",b_en:"へ is read 'e'. Put it after a place to show the direction of movement: place + へ + 行きます means 'go to (a place)'.",exJp:"私は 毎朝、駅の 近くの コンビニへ 行きます。",ex_zh:"我每天早上都去車站附近的便利商店。",ex_en:"Every morning I go to the convenience store near the station."},
      toList:{pattern:"〜と〜",t_zh:"把東西全部列出來：和、跟",t_en:"Listing things: 'and'",b_zh:"名詞和名詞之間放「と」，表示把東西全部列出來，相當於中文的「和」。列了幾個，就用幾個「と」接起來。",b_en:"Put と between nouns to list things completely, like 'and' in English. Chain as many as you need: A と B と C.",exJp:"おにぎりと お茶を 買いました。",ex_zh:"我買了飯糰和茶。",ex_en:"I bought a rice ball and tea."},
      suki:{pattern:"〜が 好きです",t_zh:"喜歡的對象用「が」",t_en:"What you like takes が",b_zh:"說「喜歡某樣東西」的時候，喜歡的對象要用「が」，不用「を」。這是初學者最常寫錯的地方之一。",b_en:"When you say you like something, the thing you like takes が, not を. This is a classic beginner mistake.",exJp:"私は さけが 好きです。",ex_zh:"我喜歡鮭魚口味。",ex_en:"I like the salmon one."},
      mashita:{pattern:"〜ました",t_zh:"禮貌的過去式：已經做了",t_en:"Polite past tense: already did it",b_zh:"動詞「ます」變成「ました」，就表示動作已經完成。買います→買いました（買了）。敘述昨天、上週做過的事都用它。",b_en:"Change ます to ました to say an action is finished: 買います → 買いました ('bought'). Use it for things you did yesterday or last week.",exJp:"今日は おにぎりと お茶を 買いました。",ex_zh:"今天我買了飯糰和茶。",ex_en:"Today I bought a rice ball and tea."},
      tai:{pattern:"〜たいです",t_zh:"想要做某件事",t_en:"Want to do something",b_zh:"動詞「ます」形去掉「ます」，加上「たいです」，就是「想要做〜」。行きます→行きたいです（想去）。只能用來說自己的願望。",b_en:"Take the ます-form, drop ます and add たいです: 行きます → 行きたいです ('want to go'). Use it for your own wishes.",exJp:"明日も コンビニへ 行きたいです。",ex_zh:"明天我也想去便利商店。",ex_en:"I want to go to the convenience store tomorrow too."},
      teiru:{pattern:"〜て います",t_zh:"持續的狀態",t_en:"An ongoing state",b_zh:"「住んでいます」不是「正在住」，而是「住在某地」這個持續的狀態。〜て います可以表示正在進行，也可以表示一直維持的狀態，要看動詞是哪一種。",b_en:"住んでいます does not describe a momentary action — it means the continuing state of living somewhere. 〜て います can show an ongoing action or a continuing state, depending on the verb.",exJp:"私は 熊本に 住んでいます。",ex_zh:"我住在熊本。",ex_en:"I live in Kumamoto."},
      deMeans:{pattern:"〜で 行きます",t_zh:"交通方式用「で」",t_en:"Transport takes で",b_zh:"搭什麼交通工具去，用「で」標示：電車で行きます（搭電車去）。走路是例外，要說「歩いて 行きます」。",b_en:"Mark how you travel with で: 電車で 行きます ('go by train'). Walking is the exception: 歩いて 行きます.",exJp:"電車で 友だちの 家へ 遊びに 行きます。",ex_zh:"我搭電車去朋友家玩。",ex_en:"I go to my friend's house by train to hang out."},
      asobini:{pattern:"〜に 行きます",t_zh:"去做某件事（目的）",t_en:"Going in order to do something",b_zh:"動詞「ます」形去掉「ます」，加上「に 行きます」，表示「去做某件事」。遊びに 行きます就是去玩、去串門子。",b_en:"Take the ます-form, drop ます and add に 行きます to say you go somewhere to do something: 遊びに 行きます = 'go to hang out'.",exJp:"友だちの 家へ 遊びに 行きます。",ex_zh:"去朋友家玩。",ex_en:"I go to my friend's house to hang out."},
      noga:{pattern:"〜のが 好きです",t_zh:"喜歡做某件事",t_en:"Liking to do something",b_zh:"想說「喜歡做某件事」，動詞要用辭書形（原形）加「のが」：見るのが 好きです（喜歡看）。對象是動作的時候，要先用「の」把動詞變成名詞的感覺。",b_en:"To say you like doing something, use the dictionary form + のが: 見るのが 好きです ('I like watching'). の turns the verb into a noun-like chunk.",exJp:"私は 窓の 外を 見るのが 好きです。",ex_zh:"我喜歡看窗外的景色。",ex_en:"I like looking out of the window."},
      kara:{pattern:"〜から",t_zh:"因為〜（理由在前面）",t_en:"Because — the reason comes first",b_zh:"「から」黏在理由那句話的最後面，意思是「因為〜」。順序跟中文一樣，先講理由，再講結果；只是中文的「因為」放在句首，日文的「から」放在理由的句尾。「因為明天要煮咖哩，所以買了材料」→ 明日は カレーを 作りますから、材料を 買いました。",b_en:"Japanese usually puts the reason first: reason + から, then the result. 'Because I'm making curry tomorrow, I bought the ingredients.'",exJp:"明日は カレーを 作りますから、材料を 買いました。",ex_zh:"因為明天要煮咖哩，所以我買了材料。",ex_en:"Because I'm making curry tomorrow, I bought the ingredients."},
      kute:{pattern:"〜くて",t_zh:"い形容詞的連接：又〜又〜",t_en:"Joining i-adjectives: 'sweet and tasty'",b_zh:"い形容詞要連接下一個形容詞時，把結尾的「い」換成「くて」：甘い→甘くて。中文說「又甜又好吃」，日文就是「甘くて、おいしいです」。",b_en:"To connect an i-adjective to the next one, change the final い to くて: 甘い → 甘くて. 'Sweet and tasty' = 甘くて、おいしいです.",exJp:"熊本の トマトは 甘くて、おいしいです。",ex_zh:"熊本的番茄又甜又好吃。",ex_en:"Kumamoto tomatoes are sweet and tasty."},
      teOrder:{pattern:"〜て、〜",t_zh:"動作的順序：先〜再〜",t_en:"Order of actions: first…, then…",b_zh:"兩個動作有先後順序時，前面的動詞用「て」形連接：帰って、入れました = 回家之後，把東西放進冰箱。「て」形就像動作之間的接力棒。",b_en:"When actions happen in order, put the first verb in the て-form: 帰って、入れました = 'I came home, then put them in the fridge.'",exJp:"家に 帰って、すぐに 冷蔵庫に 入れました。",ex_zh:"回到家之後，我馬上把東西放進冰箱。",ex_en:"When I got home, I put everything in the fridge right away."},
      toWith:{pattern:"人と",t_zh:"跟某人一起",t_en:"With someone",b_zh:"名詞後面的「と」除了「和（列舉）」，還可以表示「跟某人一起做某事」：母と 行きました = 跟媽媽一起去。看上下文就分得出來。",b_en:"と after a person can mean 'with': 母と 行きました = 'I went with my mother.' Context tells it apart from the listing 'and'.",exJp:"昨日の 夕方、母と スーパーへ 行きました。",ex_zh:"昨天傍晚，我跟媽媽去了超市。",ex_en:"Yesterday evening, I went to the supermarket with my mother."}
    };

    var FURI_DICT = null, FURI_KEYS = null;
    function furiDict(){
      if(FURI_DICT) return;
      FURI_DICT = {};
      function add(w, r){ if(w && r && w !== r && KANJI.test(w) && w.indexOf("（") < 0 && w.indexOf(" ") < 0 && !FURI_DICT[w]) FURI_DICT[w] = r; }
      ARTICLES.forEach(function(a){
        a.paragraphs.forEach(function(p){ p.forEach(function(t){ add(t.s.replace(/^「/, ""), t.r); }); });
        Object.keys(a.vocab).forEach(function(k){ add(a.vocab[k].w, a.vocab[k].r); });
      });
      Object.keys(FURI_EXTRA).forEach(function(k){ add(k, FURI_EXTRA[k]); });
      FURI_KEYS = Object.keys(FURI_DICT).sort(function(x, y){ return y.length - x.length; });
    }
    function furify(text){
      furiDict();
      var out = "", i = 0;
      while(i < text.length){
        var hit = null;
        if(KANJI.test(text.slice(i, i + 4))){
          for(var k = 0; k < FURI_KEYS.length; k++){ if(text.substr(i, FURI_KEYS[k].length) === FURI_KEYS[k]){ hit = FURI_KEYS[k]; break; } }
        }
        if(hit){ out += ruby(hit, FURI_DICT[hit]); i += hit.length; }
        else { out += esc(text[i]); i++; }
      }
      return out;
    }

      "ニ":{w:"ニンジン",r:"ninjin",zh:"紅蘿蔔",en:"carrot",i:"carrot"},
      "ヌ":{w:"ヌードル",r:"nuudoru",zh:"麵條",en:"noodles",i:"noodles"},
      "ネ":{w:"ネコ",r:"neko",zh:"貓",en:"cat",i:"cat"},
      "ノ":{w:"ノート",r:"nooto",zh:"筆記本",en:"notebook",i:"notebook"},
      "ハ":{w:"ハサミ",r:"hasami",zh:"剪刀",en:"scissors",i:"scissors"},
      "フ":{w:"フルーツ",r:"furuutsu",zh:"水果",en:"fruit",i:"fruit"},
      "ヘ":{w:"ヘリコプター",r:"herikoputaa",zh:"直升機",en:"helicopter",i:"heli"},
      "ホ":{w:"ホテル",r:"hoteru",zh:"飯店",en:"hotel",i:"hotel"},
      "マ":{w:"マンゴー",r:"mangoo",zh:"芒果",en:"mango",i:"mango"},
      "ミ":{w:"ミカン",r:"mikan",zh:"橘子",en:"mandarin orange",i:"citrus"},
      "ム":{w:"ムシ",r:"mushi",zh:"蟲",en:"bug",i:"ladybug"},
      "メ":{w:"メロン",r:"meron",zh:"哈密瓜",en:"melon",i:"melon"},
      "モ":{w:"モモ",r:"momo",zh:"桃子",en:"peach",i:"peach"},
      "ヤ":{w:"ヤギ",r:"yagi",zh:"山羊",en:"goat",i:"goat"},
      "ヨ":{w:"ヨーグルト",r:"yooguruto",zh:"優格",en:"yogurt",i:"yogurt"},
      "ラ":{w:"ライオン",r:"raion",zh:"獅子",en:"lion",i:"lion"},
      "リ":{w:"リンゴ",r:"ringo",zh:"蘋果",en:"apple",i:"apple"},
      "ル":{w:"ルール",r:"ruuru",zh:"規則",en:"rule",i:"checklist"},
      "レ":{w:"レモン",r:"remon",zh:"檸檬",en:"lemon",i:"lemon"},
      "ロ":{w:"ロボット",r:"robotto",zh:"機器人",en:"robot",i:"robot"},
      "ワ":{w:"ワニ",r:"wani",zh:"鱷魚",en:"crocodile",i:"croc"},
      "ヲ":{w:"ヲタク",r:"wotaku",zh:"御宅族（俚語寫法）",en:"an otaku (slang spelling)",i:"penlight"},
      "ン":{w:"パン",r:"pan",zh:"麵包",en:"bread",i:"bread"}
    };
    </script>
    <script>
    /* ============ Gojuon view logic ============ */
    var kanaScript = "h";
    var kanaAns = load("drw_kana", {h:{}, k:{}}); if(!kanaAns.h || typeof kanaAns.h !== "object" || !kanaAns.k || typeof kanaAns.k !== "object") kanaAns = {h:{}, k:{}};
    var selKanaKey = "";

    function openGojuon(){ closeSheet(); renderGojuon(); showView("gojuon"); }
    function strokesText(n){ var s = S(); return n === 1 ? s.strokesUnit1 : s.strokesUnit.replace("{n}", n); }
    function kanaRowsHtml(rows, sec, cols){
      var idx = 0, h = "";
      rows.forEach(function(row){
        var first = null;
        row.forEach(function(e){ if(e && !first) first = e; });
        var label = first ? (kanaScript === "h" ? first[0] : first[1]) : "";
        h += '<div class="krow' + (cols === 3 ? " y3" : "") + '"><span class="rl jp">' + esc(label) + "</span>";
        row.forEach(function(e){
          if(e){
            h += '<button type="button" class="kcell' + (selKanaKey === sec + "-" + idx ? " sel" : "") + '" data-kf="' + sec + "-" + idx + '"><span class="k jp">' + esc(kanaScript === "h" ? e[0] : e[1]) + '</span><span class="r">' + esc(e[2]) + "</span></button>";
            idx++;
          } else h += '<span class="kcell empty"></span>';
        });
        h += "</div>";
      });
      return h;
    }
    function gojuonChartsHtml(){
      var s = S();
      var h = '<h2 class="sec-title maru">' + esc(s.gjSeion) + '</h2><p class="sec-sub">' + esc(s.gjSeionSub) + "</p>" + kanaRowsHtml(KANA_SEION, "s", 5);
      h += '<h2 class="sec-title maru">' + esc(s.gjDaku) + '</h2><p class="sec-sub">' + esc(s.gjDakuSub) + "</p>" + kanaRowsHtml(KANA_DAKU, "d", 5);
      h += '<h2 class="sec-title maru">' + esc(s.gjYoon) + '</h2><p class="sec-sub">' + esc(s.gjYoonSub) + "</p>" + kanaRowsHtml(KANA_YOON, "y", 3);
      return h;
    }
    function wireKanaCells(){
      Array.prototype.forEach.call(document.querySelectorAll("#gj-charts [data-kf]"), function(b){
        b.addEventListener("click", function(){
          selKanaKey = b.getAttribute("data-kf");
          Array.prototype.forEach.call(document.querySelectorAll("#gj-charts .kcell.sel"), function(c){ c.classList.remove("sel"); });
          b.classList.add("sel");
          var p = selKanaKey.split("-");
          openKana(p[0], parseInt(p[1], 10));
        });
      });
    }
    function kanaQuizGroupHtml(g){
      var s = S(), list = g === "h" ? KANA_QUIZ_H : KANA_QUIZ_K;
      var h = '<h4 class="gj-qh">' + esc(g === "h" ? s.gjQuizH : s.gjQuizK) + "</h4>";
      list.forEach(function(q, qi){
        var chosen = kanaAns[g][qi];
        h += '<div class="q" id="kq-' + g + "-" + qi + '"><p class="qq"><span class="qnum">Q' + (qi+1) + '</span><span class="bigk jp">' + esc(q.k) + '</span></p><div class="opts">';
        q.o.forEach(function(op, oi){
          var cls = "opt", mark = "";
          if(chosen !== undefined){
            if(oi === q.a){ cls += " correct"; mark = "✓"; }
            else if(oi === chosen){ cls += " wrong"; mark = "✕"; }
          }
          h += '<button class="' + cls + '" data-kq="' + g + '" data-qi="' + qi + '" data-o="' + oi + '"' + (chosen !== undefined ? " disabled" : "") + '><span class="mk">' + mark + "</span><span>" + esc(op) + "</span></button>";
        });
        h += "</div>";
        if(chosen !== undefined){
          var ok = chosen === q.a;
          h += '<div class="why show' + (ok ? "" : " no") + '"><b>' + esc(ok ? s.qRight : s.qWrong) + "</b> " + esc(s.kanaWhy.replace("{k}", q.k).replace("{r}", q.o[q.a]) + (q.k === "を" || q.k === "ヲ" ? " " + s.kanaWo : "")) + "</div>";
        } else h += '<div class="why"></div>';
        h += "</div>";
      });
      h += '<div class="quiz-result" id="kscore-' + g + '"></div>';
      return h;
    }
    function updateKanaScore(g){
      var list = g === "h" ? KANA_QUIZ_H : KANA_QUIZ_K, el = document.getElementById("kscore-" + g);
      if(!el) return;
      if(Object.keys(kanaAns[g]).length < list.length){ el.className = "quiz-result"; el.innerHTML = ""; return; }
      var n = list.reduce(function(acc, q, qi){ return acc + (kanaAns[g][qi] === q.a ? 1 : 0); }, 0), s = S();
      el.className = "quiz-result show";
      el.innerHTML = '<span class="score">' + n + " / " + list.length + "</span>" + esc(n === list.length ? s.gjPerfect : s.gjKeep);
    }
    function gjDoneHtml(){
      var s = S(), total = KANA_QUIZ_H.length + KANA_QUIZ_K.length;
      var answered = Object.keys(kanaAns.h).length + Object.keys(kanaAns.k).length;
      var n = 0;
      [["h", KANA_QUIZ_H], ["k", KANA_QUIZ_K]].forEach(function(p){ p[1].forEach(function(q, qi){ if(kanaAns[p[0]][qi] === q.a) n++; }); });
      var t, b, img;
      if(answered < total){ t = s.gjTodoT; b = s.gjTodoB; img = "mascot.webp"; }
      else if(n >= Math.ceil(total * 0.9)){ t = s.gjDoneT; b = s.gjDoneB; img = "mascot-cheer.webp"; }
      else { t = s.gjMidT; b = s.gjMidB; img = "mascot-sleep.webp"; }
      b = b.replace("{n}", n).replace("{t}", total);
      var h = '<img src="assets/' + img + '" alt=""><div class="big">' + esc(t) + '</div><p>' + esc(b) + '</p><button class="nextbtn" id="gj-first" style="max-width:340px;margin:14px auto 0">' + esc(s.gjDoneBtn) + "</button>";
      if(answered) h += '<button class="retrybtn" id="gj-retry" style="max-width:340px;display:block;margin:10px auto 0">' + esc(s.gjRetry) + "</button>";
      return h;
    }
    function updateGjDone(){
      var el = document.getElementById("gj-done"); if(!el) return;
      el.innerHTML = gjDoneHtml();
      document.getElementById("gj-first").addEventListener("click", function(){ openArticle(ARTICLES[0].id); });
      var rb = document.getElementById("gj-retry");
      if(rb) rb.addEventListener("click", function(){
        kanaAns = {h:{}, k:{}}; save("drw_kana", kanaAns); renderGojuon();
        var qh = document.getElementById("kq-h-0"); if(qh){ qh.scrollIntoView({block:"center"}); var o = qh.querySelector(".opt"); if(o) try{ o.focus({preventScroll:true}); }catch(e){} }
      });
    }
    function answerKana(btn){
      var g = btn.getAttribute("data-kq"), qi = parseInt(btn.getAttribute("data-qi"), 10), oi = parseInt(btn.getAttribute("data-o"), 10);
      if(kanaAns[g][qi] !== undefined) return;
      var list = g === "h" ? KANA_QUIZ_H : KANA_QUIZ_K, q = list[qi], s = S();
      kanaAns[g][qi] = oi;
      save("drw_kana", kanaAns);
      var box = document.getElementById("kq-" + g + "-" + qi);
      Array.prototype.forEach.call(box.querySelectorAll(".opt"), function(b, i){
        b.disabled = true;
        if(i === q.a){ b.classList.add("correct"); b.querySelector(".mk").textContent = "✓"; }
        else if(i === oi){ b.classList.add("wrong"); b.querySelector(".mk").textContent = "✕"; }
      });
      var why = box.querySelector(".why"), ok = oi === q.a;
      why.className = "why show" + (ok ? "" : " no");
      why.innerHTML = "<b>" + esc(ok ? s.qRight : s.qWrong) + "</b> " + esc(s.kanaWhy.replace("{k}", q.k).replace("{r}", q.o[q.a]) + (q.k === "を" || q.k === "ヲ" ? " " + s.kanaWo : ""));
      updateKanaScore(g); updateGjDone();
      if(why) try{ why.setAttribute("tabindex", "-1"); why.focus({preventScroll:true}); }catch(e){}
    }
    function renderGojuon(){
      var s = S();
      var h = '<button class="backbtn" id="gj-back">' + esc(s.back) + "</button>";
      h += '<div class="reader-head"><h2 class="maru" style="font-size:1.65rem;margin:4px 0 2px">' + esc(s.gjTitle) + "</h2><p>" + esc(s.gjSub) + "</p></div>";
      h += '<div style="margin-top:16px"><div class="scriptseg" role="group" aria-label="Kana script"><button type="button" id="gj-sh" aria-pressed="' + (kanaScript === "h") + '">' + esc(s.gjHira) + ' <span class="jp">ひらがな</span></button><button type="button" id="gj-sk" aria-pressed="' + (kanaScript === "k") + '">' + esc(s.gjKata) + ' <span class="jp">カタカナ</span></button></div></div>';
      h += '<div id="gj-charts">' + gojuonChartsHtml() + "</div>";
      h += '<section class="panel"><h3 class="maru">' + esc(s.gjQuizTitle) + '</h3><p class="sub">' + esc(s.gjQuizSub) + "</p>" + kanaQuizGroupHtml("h") + kanaQuizGroupHtml("k") + "</section>";
      h += '<div class="gj-done" id="gj-done"></div>';
      document.getElementById("view-gojuon").innerHTML = h;
      document.getElementById("gj-back").addEventListener("click", function(){ renderHome(); showView("home"); });
      function setScript(sc){
        if(kanaScript === sc) return;
        kanaScript = sc;
        document.getElementById("gj-sh").setAttribute("aria-pressed", String(sc === "h"));
        document.getElementById("gj-sk").setAttribute("aria-pressed", String(sc === "k"));
        document.getElementById("gj-charts").innerHTML = gojuonChartsHtml();
        wireKanaCells();
      }
      document.getElementById("gj-sh").addEventListener("click", function(){ setScript("h"); });
      document.getElementById("gj-sk").addEventListener("click", function(){ setScript("k"); });
      wireKanaCells();
      Array.prototype.forEach.call(document.querySelectorAll("#view-gojuon [data-kq]"), function(b){
        b.addEventListener("click", function(){ answerKana(b); });
      });
      updateKanaScore("h"); updateKanaScore("k"); updateGjDone();
    }
    function iconSvg(name){
      var inner = ICONS[name];
      if(!inner) return "";
      return '<svg viewBox="0 0 64 64" aria-hidden="true">' + inner + "</svg>";
    }
    function hlWord(word, target){
      var i = word.indexOf(target);
      if(i < 0) return esc(word);
      return esc(word.slice(0, i)) + '<span class="tgt">' + esc(target) + "</span>" + esc(word.slice(i + target.length));
    }
    function fcardHtml(artInner, word, target, ro, mean){
      var h = '<div class="fcard"><div class="fcard-art">' + artInner + '</div><div class="fcard-word jp">' + hlWord(word, target) + "</div>";
      if(ro) h += '<div class="fcard-ro">' + esc(ro) + "</div>";
      if(mean) h += '<div class="fcard-mean">' + esc(mean) + "</div>";
      return h + "</div>";
    }
    function openKana(sec, idx){
      var s = S(), e, ch, counter, romaji, strokesTxt, exW, exM, cardHtml = "";
      if(sec === "s"){
        e = KANA_FLAT_S[idx]; if(!e) return;
        ch = kanaScript === "h" ? e[0] : e[1];
        counter = kanaScript === "h" ? e[1] : e[0];
        romaji = e[2];
        var st = kanaScript === "h" ? e[3] : e[4];
        var hint = kanaScript === "h" ? (lang === "zh" ? e[5] : e[6]) : (lang === "zh" ? e[7] : e[8]);
        strokesTxt = strokesText(st) + hint;
        exW = kanaScript === "h" ? e[9] : e[12];
        exM = kanaScript === "h" ? (lang === "zh" ? e[10] : e[11]) : (lang === "zh" ? e[13] : e[14]);
        var card = kanaScript === "h" ? KANA_CARD_H[e[0]] : KANA_CARD_K[e[1]];
        if(card) cardHtml = fcardHtml(iconSvg(card.i), card.w, ch, card.r, lang === "zh" ? card.zh : card.en);
      } else if(sec === "d"){
        e = KANA_FLAT_D[idx]; if(!e) return;
        var base = KANA_BASE[e[3]]; if(!base) return;
        ch = kanaScript === "h" ? e[0] : e[1];
        counter = kanaScript === "h" ? e[1] : e[0];
        romaji = e[2];
        var bst = kanaScript === "h" ? base[3] : base[4];
        var add = e[4] === "d" ? 2 : 1;
        var bch = kanaScript === "h" ? base[0] : base[1];
        var tpl = e[4] === "d" ? s.hintDaku : s.hintHandaku;
        strokesTxt = strokesText(bst + add) + tpl.replace("{b}", bch);
        exW = kanaScript === "h" ? e[5] : e[8];
        exM = kanaScript === "h" ? (lang === "zh" ? e[6] : e[7]) : (lang === "zh" ? e[9] : e[10]);
      } else {
        e = KANA_FLAT_Y[idx]; if(!e) return;
        ch = kanaScript === "h" ? e[0] : e[1];
        counter = kanaScript === "h" ? e[1] : e[0];
        romaji = e[2];
        strokesTxt = s.hintYoon.replace("{a}", ch.charAt(0)).replace("{s}", ch.charAt(1));
        exW = kanaScript === "h" ? e[3] : e[6];
        exM = kanaScript === "h" ? (lang === "zh" ? e[4] : e[5]) : (lang === "zh" ? e[7] : e[8]);
      }
      var hasCard = !!cardHtml;   // the picture card already shows the example word, so don't repeat a different one below
      if(!cardHtml) cardHtml = fcardHtml('<span class="fcard-kana jp">' + esc(ch) + "</span>", exW, ch, "", exM);
      var h = cardHtml + '<span class="kind v">' + esc(s.kindKana) + '</span><h3 class="jp" id="sheet-title" style="font-size:2.6rem">' + esc(ch) + "</h3>";
      h += listenBtn(ch);
      h += '<div class="pos">' + esc(kanaScript === "h" ? s.gjKata : s.gjHira) + esc(s.colon) + '<span class="jp">' + esc(counter) + "</span></div>";
      h += '<div class="lbl">' + esc(s.lblRomaji) + '</div><div class="mean" style="margin-top:0;font-size:1.5rem">' + esc(romaji) + "</div>" + (ch === "を" || ch === "ヲ" ? '<div class="exzh">' + esc(s.kanaWo) + "</div>" : "");
      h += '<div class="lbl">' + esc(s.lblStrokes) + '</div><div class="body">' + esc(strokesTxt) + "</div>";
      // the card at the top already shows the example word; only add a "listen" button for it
      var sayW = hasCard ? (kanaScript === "h" ? KANA_CARD_H[e[0]] : KANA_CARD_K[e[1]]).w : exW;
      if(sayW && sayW !== ch) h += listenBtn(sayW).replace('class="listen"', 'class="listen" style="margin-top:14px"').replace(esc(s.listen), esc(s.listen) + " · " + esc(sayW));
      openSheet(h);
    }
    setFuri(furiOn); renderTabs(); syncTopH();
    route();
    </script>
  </body>
</html>
